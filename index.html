<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Premier Jeu</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Mon Mini Border Clash</h1>
    <p id="resultat">Clique sur le bouton pour lancer le dé !</p>
    <button onclick="lancerDe()">Lancer le dé</button>

    <script>
        function lancerDe() {
            // Génère un nombre aléatoire entre 1 et 6
            let de = Math.floor(Math.random() * 6) + 1;
            document.getElementById("resultat").innerText = "Tu as fait un : " + de;
        }
    </script>

</body>
</html>
